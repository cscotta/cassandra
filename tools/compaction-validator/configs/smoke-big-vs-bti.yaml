# BIG vs BTI smoke — small-target version of big-vs-bti.yaml.

version: 1

run:
  target_bytes: 64M
  datagen_threads: 2
  compaction_threads: 4
  validation_threads: 4
  max_runs: 1
  no_cleanup: true
  no_ui: true
  ignore_errata:
    - equal-ts-tiebreaker
    - tombstone-expiring-flags-both-set
    - tombstone-resurrected-by-expiring
    - prev-unfiltered-size-zero
    - index-block-width-off-by-one
    - wide-column-subset-dropped-last

schema:
  partitioner: Murmur3

comparison:
  control:
    name: big
    pipeline: ITERATOR
    format: BIG
  experiment:
    name: bti
    pipeline: ITERATOR
    format: BTI
